name: Update news

on:
  schedule:
    - cron: "17 12 * * *"       # daily at 12:17 UTC = 5:17 am in Phoenix
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write    # commit the refreshed data

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the collector
        run: python -m unittest discover -s tests

      - name: Collect posts
        env:   # optional: AI summaries switch on when these secrets exist
          SUMMARY_ENDPOINT: ${{ secrets.SUMMARY_ENDPOINT }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}   # higher GitHub search limits for the Community tab
        run: python scripts/collect.py

      - name: Publish the refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json docs/feed.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update news data"
            git pull --rebase --autostash
            git push
          fi
