name: Update news

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours, at 17 minutes past (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write    # commit the refreshed data
  models: read       # AI summaries through GitHub Models, using the built-in token

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the collector
        run: python -m unittest discover -s tests

      - name: Collect posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py

      - name: Publish the refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json docs/feed.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update news data"
            git pull --rebase --autostash
            git push
          fi
