# Copilot & Agent Watch: everything the collector tracks lives in this file.
# Edit it on github.com and the next scheduled run picks the change up.

[site]
title = "Copilot & Agent Watch"
url = "https://chadmcox.github.io/Second-Brain/"
ingest_days = 92        # ignore posts older than this when they are first seen
retention_days = 180    # drop stored posts older than this
max_items = 1500

[summaries]
# AI summaries are optional. They switch on when the repository has two secrets:
#   SUMMARY_ENDPOINT  an OpenAI-compatible chat completions URL, for example
#                     https://<resource>.openai.azure.com/openai/v1/chat/completions
#   SUMMARY_API_KEY   the key for it
# The model (or Azure deployment) name comes from the SUMMARY_MODEL secret, or
# from this list, tried in order.
enabled = true
models = []
max_per_run = 40        # posts summarised per run
batch_size = 8          # posts per model request
max_age_days = 30       # older posts keep the source's own excerpt

# ---------------------------------------------------------------- products
# A post gets a product tag when one of `any` appears in its title or opening
# lines (whole words, case-insensitive) and none of `none` do.
# scope = "microsoft" limits the tag to Microsoft sources.
# For themes: scope = "security" means Threat intel only, scope = "all" means every tab.

[[topics]]
id = "copilot"
name = "Microsoft 365 Copilot"
any = ["copilot"]
none = ["github copilot"]

[[topics]]
id = "copilotstudio"
name = "Copilot Studio"
any = ["copilot studio", "agent builder"]
none = []

[[topics]]
id = "githubcopilot"
name = "GitHub Copilot"
any = ["github copilot"]
none = []

[[topics]]
id = "cowork"
name = "Copilot Cowork"
any = ["cowork"]
none = ["coworking"]

[[topics]]
id = "autopilot"
name = "Copilot Autopilot"
any = ["autopilot"]
none = ["windows autopilot", "autopilot device preparation", "autopilot profile", "intune"]
scope = "microsoft"

[[topics]]
id = "agent365"
name = "Agent 365"
any = ["agent 365", "agent365"]
none = []

[[topics]]
id = "entra"
name = "Entra"
any = ["entra", "agent id", "conditional access"]
none = []

[[topics]]
id = "defender"
name = "Defender"
any = ["defender", "security copilot", "sentinel"]
none = []

# ------------------------------------------------------------------ themes
# A theme is a tag that applies to every company, not one Microsoft product.
# It gets its own row on the Overview and a Theme filter on both tabs. A post
# that matches a theme is kept even when its source filters by keywords.

[[topics]]
id = "personal-agents"
name = "Personal agents"
theme = true
any = ["personal agent", "personal agents", "personal assistant", "personal assistants",
       "personal ai", "personal superintelligence", "muse", "muse spark"]
none = []

[[topics]]
id = "decision-models"
name = "Decision models"
theme = true
any = ["decision model", "decision models", "jev", "laya", "typesafe", "typesafe ai",
       "system one model", "system one models", "system one decision"]
none = []

[[topics]]
id = "agent-registries"
name = "Agent registries"
theme = true
any = ["agent registry", "agent registries", "agent catalog", "agent catalogs", "agent gallery",
       "agent store", "agent marketplace", "agent directory", "agent inventory",
       "plugin registry", "tool registry", "mcp registry", "registry of agents",
       "agent card", "agent cards"]
none = []

[[topics]]
id = "security-agents"
name = "Security agents"
theme = true
scope = "all"           # every tab, including Threat intel
any = ["red team", "red teams", "red teaming", "red-teaming", "blue team", "blue teams",
       "purple team", "security agent", "security agents", "cyber agent", "cyber agents",
       "cybersecurity agent", "cybersecurity agents", "soc agent", "soc agents", "agentic soc",
       "autonomous soc", "ai soc", "triage agent", "threat hunting agent", "pentest agent",
       "pentesting agent", "ai pentesting", "autonomous pentesting", "offensive ai",
       "vulnerability discovery", "cyber model", "cyber models", "security copilot",
       "gpt-red", "daybreak", "charlotte ai", "mdash", "mai-cyber", "big sleep", "xbow",
       "codex security", "cyber verification program"]
none = []

[[topics]]
id = "ai-threats"
name = "AI threats"
theme = true
scope = "security"      # only tags posts from the threat intel sources
any = ["ai", "llm", "llms", "genai", "generative ai", "chatgpt", "claude", "gemini", "copilot",
       "ai agent", "ai agents", "agentic", "prompt injection", "jailbreak", "jailbreaks",
       "deepfake", "deepfakes", "mcp", "model theft", "distillation", "ai-powered",
       "ai-generated", "ai-driven", "openai", "anthropic", "hugging face"]
none = []

[[topics]]
id = "incidents"
name = "Security incidents"
theme = true
scope = "security"
any = ["breach", "breaches", "breached", "data breach", "ransomware", "zero-day", "zero-days",
       "actively exploited", "exploited in the wild", "under active exploitation",
       "supply chain attack", "cyberattack", "cyberattacks", "cyber attack", "outage",
       "hacked", "data leak", "stolen data", "extortion"]
none = []

# ------------------------------------------------------------------ models
# The Models tab is built from OpenRouter's public model listing: the newest
# release of each model family per lab, its list price and the change against
# the previous release of the same family.

[models]
enabled = true
url = "https://openrouter.ai/api/v1/models"
per_lab = 6             # newest families shown per lab
max_age_days = 365      # hide families with no release in this long
labs = [
  { prefix = "openai", name = "OpenAI" },
  { prefix = "anthropic", name = "Anthropic" },
  { prefix = "google", name = "Google" },
  { prefix = "x-ai", name = "xAI" },
  { prefix = "meta-llama", name = "Meta" },
  { prefix = "mistralai", name = "Mistral" },
  { prefix = "microsoft", name = "Microsoft" },
  { prefix = "amazon", name = "Amazon" },
  { prefix = "deepseek", name = "DeepSeek" },
]

# Microsoft's own models are not in that listing, so they come from Azure's
# public retail price list (global deployment, East US 2 meters).
[models.azure]
enabled = true
lab = "Microsoft"
url = "https://prices.azure.com/api/retail/prices?$filter=productName eq 'MAI Models' and priceType eq 'Consumption' and armRegionName eq 'eastus2'"
home = ""

# The price list has no descriptions. Add one line per model here, keyed by
# the name exactly as the Models tab shows it.
[models.azure.about]
"MAI-Thinking-1" = ""
"MAI-Cyber-1-Flash" = ""
"Code 1.1 Flash" = ""

# --------------------------------------------------------------- community
# The Community tab lists public GitHub repositories that carry one of these
# topics and had a commit recently. They are ranked by stars gained over the
# past week (once a week of history exists), then by total stars.

[community]
enabled = true
per_topic = 20          # repositories read per topic
per_label = 15          # repositories shown per "Built for" label
max_rows = 45           # repositories shown in total
active_days = 45        # must have a commit this recently
pinned = []             # "owner/repo" entries that always show first
exclude = []            # "owner/repo" entries to hide
topics = [
  { topic = "copilot-studio", label = "Copilot Studio" },
  { topic = "microsoft-copilot-studio", label = "Copilot Studio" },
  { topic = "microsoft-365-copilot", label = "Microsoft 365 Copilot" },
  { topic = "m365-copilot", label = "Microsoft 365 Copilot" },
  { topic = "declarative-agents", label = "Microsoft 365 Copilot" },
  { topic = "copilot-agents", label = "Microsoft 365 Copilot" },
  { topic = "github-copilot", label = "GitHub Copilot" },
  { topic = "copilot-extension", label = "GitHub Copilot" },
]

