# Copilot & Agent Watch: everything the collector tracks lives in this file.
# Edit it on github.com and the next scheduled run picks the change up.

[site]
title = "Copilot & Agent Watch"
url = "https://chadmcox.github.io/Second-Brain/"
ingest_days = 45        # ignore posts older than this when they are first seen
retention_days = 180    # drop stored posts older than this
max_items = 1500

[summaries]
enabled = true
# Tried in order until one answers. See https://github.com/marketplace/models
models = ["openai/gpt-4.1-mini", "openai/gpt-4o-mini", "openai/gpt-4.1"]
max_per_run = 40        # posts summarised per run (keeps you inside the free rate limit)
batch_size = 8          # posts per model request
max_age_days = 30       # older posts keep the source's own excerpt

# ---------------------------------------------------------------- products
# A post gets a product tag when one of `any` appears in its title or opening
# lines (whole words, case-insensitive) and none of `none` do.
# scope = "microsoft" limits the tag to Microsoft sources.

[[topics]]
id = "copilot"
name = "Microsoft 365 Copilot"
any = ["copilot"]
none = []

[[topics]]
id = "cowork"
name = "Copilot Cowork"
any = ["cowork"]
none = ["coworking"]

[[topics]]
id = "opal"
name = "Opal"
any = ["opal", "computer use agent", "windows 365 for agents"]
none = ["optimizely"]
scope = "microsoft"

[[topics]]
id = "autopilot"
name = "Copilot Autopilot"
any = ["autopilot"]
none = ["windows autopilot", "autopilot device preparation", "autopilot profile", "intune"]
scope = "microsoft"

[[topics]]
id = "agent365"
name = "Agent 365"
any = ["agent 365", "agent365"]
none = []

[[topics]]
id = "entra"
name = "Entra"
any = ["entra", "agent id", "conditional access"]
none = []

[[topics]]
id = "defender"
name = "Defender"
any = ["defender", "security copilot", "sentinel"]
none = []

# ----------------------------------------------------------------- sources
# type    "rss"  = RSS or Atom feed
#         "page" = a site with no feed: the collector reads the listing page,
#                  keeps links whose path matches link_pattern, then opens each
#                  new post to read its title, description and date.
# filter  "all"      keep every post
#         "topics"   keep posts that match at least one product above
#         "keywords" keep posts that contain one of `keywords` (whole words)
# topics  product tags every post from this source gets

[[sources]]
